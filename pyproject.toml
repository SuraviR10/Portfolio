[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suravi-portfolio"
version = "0.1.0"
description = "Interactive portfolio website with optional Flask chatbot backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==2.3.0",
    "Flask-CORS==4.0.0",
    "gunicorn==20.1.0",
    "Werkzeug==2.3.0"
]
